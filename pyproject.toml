[project]
name = "pyramid_exclog"
version = "1.1"
description = "A package which logs to a Python logger when an exception is raised by a Pyramid application"
dynamic = ["readme"]

license = "LicenseRef-Repoze-BSD-derived"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Chris McDonough", email = "pylons-discuss@googlegroups.com" },
]
maintainers = [
  { name = "Pylons Project", email = "pylons-discuss@googlegroups.com" },
]

requires-python = ">=3.11"
dependencies = [
  "pyramid >= 1.5",
]

keywords = ["exception", "handler", "pylons", "pyramid", "tween", "wsgi"]
classifiers = [
  "Development Status :: 6 - Mature",
  "Framework :: Pyramid",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP :: WSGI",
]

[project.urls]
Changelog = "https://docs.pylonsproject.org/projects/pyramid-exclog/en/latest/changes.html"
Documentation = "https://docs.pylonsproject.org/projects/pyramid-exclog/en/latest/index.html"
Homepage = "https://github.com/Pylons/pyramid_exclog"
"Issue Tracker" = "https://github.com/Pylons/pyramid_exclog/issues"

[dependency-groups]
docs = [
  "Sphinx >= 1.8.1",
  "docutils",
  "pylons-sphinx-themes >= 1.0.9",
]
lint = [
  "black ~= 26.10.0",
  "build",
  "check-manifest",
  "flake8",
  "flake8-bugbear",
  "isort",
  "readme_renderer",
  "twine",
]
testing = [
  "coverage >= 5.0",
  "pytest",
  "pytest-cov",
]

[build-system]
requires = ["setuptools >= 77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
skip-string-normalization = true
target-version = ["py311", "py312", "py313", "py314", "py315"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.pytest_cache
  | dist
  | build
  | docs
)/
'''

# This next section only exists for people that have their editors
# automatically call isort, black already sorts entries on its own when run.
[tool.isort]
profile = "black"
line_length = 79
force_sort_within_sections = true
sections = "FUTURE,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
known_first_party = "pyramid_exclog"

[tool.pytest.ini_options]
addopts = "-W always"
python_files = "test_*.py"
testpaths = [
  "tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst" }
